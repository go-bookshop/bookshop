name: ci-pipeline

on:
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  lint:
    name: Run golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60

  migrate:
    name: Migrate DB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download Migrate
        run: curl -L https://github.com/golang-migrate/migrate/releases/download/v4.18.1/migrate.linux-amd64.tar.gz  | tar xvz
      - name: KILL migrations
        run: ./migrate -path ./migrations -database '${{ secrets.DATABASE_URL }}' down --all

  build:
    name: Build App
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create env file
        run: |
          echo DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }} >> .env
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Checking module dependencies
        run: make tidy/diff
      - name: Build the cmd/api application
        run: make build/api
      - name: Build the Docker image for cmd/api application
        run: make build/api/image
