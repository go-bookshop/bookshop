name: cd-pipeline

on:
  push:
    branches: [ "main", "dev" ]

permissions:
  contents: read

jobs:
  build:
    name: Build App
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create env file
        run: |
          echo DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }} >> .env
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Checking module dependencies
        run: make tidy/diff
      - name: Build the cmd/api application
        run: make build/api
      - name: Build the Docker image for cmd/api application
        run: make build/api/image

  migrate:
    name: Migrate DB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download Migrate
        run: curl -L https://github.com/golang-migrate/migrate/releases/download/4.16.2/migrate.linux-amd64.tar.gz  | tar xvz
      - name: Run migrations
        run: ./migrate -path ./migrations -database '${{ secrets.DATABASE_URL }}' up

  deploy:
    name: Deploy App
    runs-on: ubuntu-24.04
    needs: [build, migrate]
    steps:
      - uses: actions/checkout@v4
      - name: Create env file
        run: |
          echo DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }} >> .env
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/bookshop:latest
      - name: Trigger Render deploy hook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}